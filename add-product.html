<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج جديد</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <button class="add-product-btn">تسجيل منتج جديد</button>
            <button id="logoutBtn">تسجيل الخروج</button>
            <h1>لوحة التحكم</h1>
        </div>
    </header>

    <main class="container">
        <h2>إضافة منتج جديد</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label for="productName">اسم المنتج:</label>
                <input type="text" id="productName" required>
            </div>
            <div class="form-group">
                <label for="productDescription">وصف المنتج:</label>
                <textarea id="productDescription" required></textarea>
            </div>
            <div class="form-group">
                <label for="productImage">صورة المنتج:</label>
                <input type="file" id="productImage" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="productPrice">سعر المنتج:</label>
                <input type="number" id="productPrice" step="0.01" required>
            </div>
            <div class="form-group">
                <label>طريقة الدفع:</label>
                <div class="payment-options">
                    <label><input type="checkbox" name="payment" value="paypal"> باي بال</label>
                    <label><input type="checkbox" name="payment" value="rajhi"> الراجحي</label>
                    <label><input type="checkbox" name="payment" value="credit"> بطاقة ائتمان</label>
                </div>
            </div>
            <button type="submit">إضافة المنتج</button>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
