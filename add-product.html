<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج - TechnoBox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="admin-panel-header">
        <div class="container">
            <a href="products.html" class="back-btn">العودة للمنتجات</a>
            <h1><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h1>
        </div>
    </header>

    <main class="container">
        <form id="addProductForm">
            <div class="form-group">
                <label for="productName">اسم المنتج:</label>
                <input type="text" id="productName" required>
            </div>
            <div class="form-group">
                <label for="productDescription">وصف المنتج:</label>
                <textarea id="productDescription" required></textarea>
            </div>
            <div class="form-group">
                <label for="productImage">صورة المنتج:</label>
                <input type="file" id="productImage" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="productPrice">سعر المنتج:</label>
                <input type="number" id="productPrice" required>
            </div>
            <button type="submit">إضافة المنتج</button>
        </form>
    </main>

    <script src="js/add-product.js"></script>
</body>
</html>
